version: 0.1.0
type: plugin
author: binhuhu
name: dmn
label:
  en_US: DMN Decision Tables
  zh_Hans: DMN 决策表
description:
  en_US: >-
    Evaluate and check DMN decision tables locally: all seven hit policies
    (UNIQUE, ANY, PRIORITY, FIRST, RULE ORDER, OUTPUT ORDER, COLLECT with
    SUM/MIN/MAX/COUNT), S-FEEL cells, DMN 1.1–1.5 XML or JSON. No service,
    no credentials, standard library only.
  zh_Hans: >-
    在插件内执行和检查 DMN 决策表：支持全部 7 种 Hit Policy（UNIQUE、ANY、PRIORITY、
    FIRST、RULE ORDER、OUTPUT ORDER、COLLECT 及 SUM/MIN/MAX/COUNT 聚合）、S-FEEL
    单元格、DMN 1.1–1.5 XML 或 JSON。无需外部服务和凭据。
